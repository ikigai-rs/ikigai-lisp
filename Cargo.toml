[package]
name = "ikigai-lisp"
# ★ 0.2.0 is THE SANDBOX RELEASE (audit round 6, ledger #903: 19 reproduced bugs, 13 serious). BREAKING:
# a program reaches only a CONSTRUCTIVE ALLOWLIST (123 names + 8 macros, pinned by a test that the reachable set
# EQUALS the list); `require` of any path, `require-builtin`, `defmacro`, `begin-for-syntax`, procedural
# `define-syntax` and Steel's private names are refused before compile; stdio is unreachable; Exists/Sink/Delete
# on the lisp doors are refused; non-UTF-8 input is an error. Isolation: one engine per eval (back-to-back evals
# cost ~63 ms of build, accepted 2026-10-09). A timed-out runaway is interrupted. `Limits`/`set_limits` (stack,
# program/input bytes, nesting) replace IKIGAI_LISP_WORKERS. Hosts must wrap the binding in a Timeout to stop a
# runaway (ikigai-cli: ledger #920).
# 0.3.0 NAMES THE SPACE (ledger #987): `space()` claims `urn:iki:space:lisp` (`SPACE_ID`). A minor bump because
# the name changes `answered_by`, `urn:kernel:topology` and cache partitioning for every host that mounts it; hosts
# adopt it deliberately. Floor: ikigai-core 0.1.89, where `bind` drops a name.
# 0.3.1 (ledger #921): steel-core pinned `=0.8.3`, the one Steel the allowlist was checked
# against, and the crate no longer creates Steel's home directory (nothing reads it).
# Also in 0.3.1 (ledger #980): every door can be piped into — a stored program declares only
# `in` and `urn:lisp:run` only `data` beside its named three (both still READ `content`), and
# an uncaught verb failure is retyped only when it is the failure itself, untouched, so a
# program's own error quoting a caught one keeps its words.
# 0.4.0 (ledger #2353): adopt core 0.2, the streams release (ledger #2261).
# Breaking for consumers: public core types now come from the 0.2 line.
# 0.4.1 (ledger #2489): `sort` (native or Lisp comparator) and `string-split` in the sandbox;
# 24 allowlist entries, all evaluation-local, none reaching the host. Additive: a patch.
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Steel-backed Lisp evaluator as an ikigai module: `urn:lisp:eval` runs s-expressions whose builtins ARE the kernel verbs (source/sink/meta/exists/delete), each cap-scoped and issued back through the kernel. Code is a resource; the capability is the builtin set."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-lisp"
homepage = "https://github.com/ikigai-rs/ikigai-lisp"
readme = "README.md"
keywords = ["ikigai", "roc", "lisp", "scheme", "capability"]
categories = ["compilers", "caching"]

[dependencies]
# 0.2.0 is the streams release (ledger #2261). The old 0.1 pin meant <0.2.0
# under 0.x rules. This caret floor admits 0.2.x so hosts share one core.
ikigai-core = "0.2.0"
async-trait = "0.1"
# The neutral s-expression foundation — owns the pure `sexpr_to_sparql` (query) and
# `sexpr_to_turtle` (graph) compilers over its language-agnostic `Sexpr` datum (single
# source of truth). The `(sparql-select …)` and `(graph …)` builtins adapt Steel's
# `SteelVal` into `Sexpr` and call these, rather than carrying an inline compiler.
# 0.3.0 moves the compilers onto the streams core 0.2 line.
ikigai-sexpr = "0.3.0"
# The Scheme engine; its builtins are the kernel verbs. 0.8 is the current
# embedding API (`Engine::run`, `register_fn`).
# PINNED EXACTLY (ledger #921): the sandbox's allowlist is DERIVED from Steel's compiled
# stdlib (`src/sandbox.rs`), and its pins were checked against 0.8.3 alone — they do not
# even compile on 0.8.2 (`CompiledModule::get_compiled_ast` is new in 0.8.3), and a patch
# release moves stdlib internals (0.8.2 -> 0.8.3 changed stdlib.scm and the macro kernel).
# A caret (or `~0.8.3`, the same range under 0.x) would admit a 0.8.4 nobody has checked.
# `=` means every Steel this runs on was checked by CI; a Steel upgrade is a release of
# this crate, with the allowlist re-derived. No other ikigai crate depends on steel-core,
# so the exact pin cannot split a consumer's graph.
steel-core = "=0.8.3"
[dev-dependencies]
# Test executor (`block_on`, `now_or_never`) only — the sync↔async bridge itself
# is core's `Invocation::scope_sync`, so the crate proper needs no channel deps.
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`), including the composed
# signing doors. 0.12.0 also enables BODIES and BODY-INPUTS by default.
ikigai-conformance = "0.12.0"
# The real signing module verifies stored programs through the kernel. 0.4.1
# requires core 0.2.1, admitted by our 0.2.0 caret floor. 0.4.2 declares `in`
# `reads_body` (ledger #2590), which the conformance suite's Ed25519 BODY-INPUTS
# waiver depends on (`tests/conformance.rs`, ledger #2726).
ikigai-sign = "0.4.2"
# The wall-clock Timeout overlay proves the wire-eval governor end to end.
ikigai-throttle = "0.3.0"
# A real sibling proves verb-as-function across a module boundary.
ikigai-fn = "0.7.0"
# The real SPARQL engine runs the compiled-query oracle end to end.
ikigai-sparql = "0.3.1"
# The real REPL engine proves positional and piped routing (`tests/pipeline.rs`).
# All these released siblings share core 0.2 with the library.
ikigai-engine = "0.2.0"
# The engine reads each contract as `Meta as=application/json`; the test kernel must answer,
# or the engine fails OPEN and routes every value to `in`, proving nothing.
serde_json = "1"

# Every evaluation builds its own Steel engine (isolation: see the module docs), and an
# unoptimized Steel takes ~1 s to build one where an optimized one takes ~60 ms. Optimize
# Steel alone in the dev/test profile so the test suite measures our code, not Steel's
# debug build. A profile applies only to this workspace's own builds, never a consumer's.
[profile.dev.package.steel-core]
opt-level = 3
